; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = libopencm3

upload_protocol = cmsis-dap
debug_tool = cmsis-dap

board_build.f_cpu = 72000000L

; Orientation: pick exactly one
;   -DUI_PORTRAIT          portrait (default)
;   -DUI_PORTRAIT_FLIP      portrait 180° flipped
;   -DUI_LANDSCAPE          landscape normal    (rotation 3, positive→right ▸)
;   -DUI_LANDSCAPE_FLIP     landscape inverted  (rotation 2, positive→left  ◂)
build_flags =
    -DUI_LANDSCAPE
    -DCATPPUCCIN_FRAPPE
    -DBATTERY_4S_LIFEPO4


